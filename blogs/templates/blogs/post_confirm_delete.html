{% extends 'base.html' %}

{% block title %}Удаление · {{ block.super }}{% endblock %}

{% block content %}
<div class="card form-card mx-auto border-danger">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Удалить публикацию?</h1>
    <p class="mb-1"><strong class="text-break-all">«{{ post.title }}»</strong></p>
    <p class="meta mb-4">Вместе с ней удалятся комментарии. Это действие нельзя отменить.</p>
    <form method="post" class="d-flex flex-wrap">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger mr-2 mb-2">Да, удалить</button>
      <a class="btn btn-outline-secondary mb-2" href="{% url 'blogs:detail' post.id %}">Отмена</a>
    </form>
  </div>
</div>
{% endblock content %}
